<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rudra CSC - Service Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #f8fafc;
            --surface: #ffffff;
            --csc-blue: #0055a5;
            --csc-orange: #f37021;
            --primary: #0055a5;
            --primary-hover: #004080;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body{
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-color: var(--bg-main);
            background-image: radial-gradient(circle, rgba(0,85,165,0.07) 1px, transparent 1px);
            background-size: 26px 26px;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        .hidden { display: none !important; }

        /* ================= 3D LOGIN SCREEN ================= */
        #loginScreen {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: 
                radial-gradient(circle at 20% 20%, #2457a6 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #0b2b52 0%, transparent 40%),
                linear-gradient(135deg,#06152b,#0b3763,#06152b);
            perspective: 1200px;
            z-index: 1000;
        }

        /* Ambient grid texture */
        .grid-overlay{
            position: absolute;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
            background-size: 48px 48px;
            animation: gridPan 22s linear infinite;
            -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 75%);
            mask-image: radial-gradient(circle at center, black 0%, transparent 75%);
        }

        @keyframes gridPan{
            from{ background-position: 0 0, 0 0; }
            to{ background-position: 48px 48px, 48px 48px; }
        }

        /* Background 3D circles */
        .bg{
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }

        .circle{
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: 0 0 40px rgba(70,180,255,.12);
            animation: float 8s ease-in-out infinite;
        }

        .c1{
            width: 420px;
            height: 420px;
            left: -140px;
            top: -130px;
        }

        .c2{
            width: 550px;
            height: 550px;
            right: -220px;
            bottom: -210px;
            animation-delay: 2s;
        }

        .c3{
            width: 220px;
            height: 220px;
            right: 15%;
            top: 8%;
            animation-delay: 4s;
        }

        @keyframes float{
            0%,100%{
                transform: translateY(0) rotateX(0deg);
            }
            50%{
                transform: translateY(-25px) rotateX(15deg);
            }
        }

        /* Login Box */
        .login-box{
            width: min(430px, 90%);
            padding: 42px 38px;
            position: relative;
            z-index: 2;
            text-align: center;

            background: rgba(255,255,255,.10);
            border: 1px solid rgba(255,255,255,.22);
            border-radius: 28px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow: 
                0 30px 80px rgba(0,0,0,.45),
                inset 0 1px 1px rgba(255,255,255,.2);

            transform-style: preserve-3d;
            animation: boxIn 1s cubic-bezier(.17,.67,.3,1.3);
        }

        @keyframes boxIn{
            from{
                opacity: 0;
                transform: rotateX(30deg) translateY(80px) scale(.8);
            }
            to{
                opacity: 1;
                transform: rotateX(0) translateY(0) scale(1);
            }
        }

        /* CSC Logo */
        .logo{
            width: 105px;
            height: 105px;
            margin: 0 auto 20px;

            border-radius: 50%;
            background: white;

            display: flex;
            justify-content: center;
            align-items: center;

            box-shadow: 
                0 15px 35px rgba(0,0,0,.35),
                0 0 35px rgba(80,190,255,.3);

            animation: logoFloat 4s ease-in-out infinite;
        }

        .logo span{
            font-size: 35px;
            font-weight: 900;
            color: #0759a6;
            letter-spacing: -3px;
        }

        @keyframes logoFloat{
            0%,100%{
                transform: translateZ(30px) rotateY(0deg);
            }
            50%{
                transform: translateZ(45px) rotateY(8deg);
            }
        }

        h1.login-heading{
            color: white;
            font-size: 29px;
            margin-bottom: 7px;
            letter-spacing: .5px;
        }

        .subtitle{
            color: rgba(255,255,255,.68);
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Input */
        .input-box{
            position: relative;
            margin-bottom: 18px;
        }

        .input-box input{
            width: 100%;
            height: 58px;
            padding: 0 20px;

            border: none;
            outline: none;

            border-radius: 15px;

            background: rgba(0,0,0,.25);
            border: 1px solid rgba(255,255,255,.15);

            color: white;
            font-size: 18px;
            text-align: center;
            letter-spacing: 5px;

            transition: .3s;
        }

        .input-box input::placeholder{
            color: rgba(255,255,255,.5);
            letter-spacing: 0;
            font-size: 15px;
        }

        .input-box input:focus{
            border-color: #53c8ff;
            box-shadow: 0 0 20px rgba(50,190,255,.25);
            transform: translateZ(12px);
        }

        /* Login Button */
        .login-btn{
            width: 100%;
            height: 58px;
            border: 0;
            border-radius: 15px;

            background: linear-gradient(135deg,#008cff,#00c6ff);
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 
                0 10px 25px rgba(0,150,255,.35),
                inset 0 1px rgba(255,255,255,.35);

            transition: .25s;
        }

        .login-btn:hover{
            transform: translateY(-3px) translateZ(15px);
            box-shadow: 0 18px 35px rgba(0,150,255,.45);
        }

        .login-btn:active{
            transform: scale(.96);
        }

        .error{
            height: 20px;
            margin-top: 12px;
            color: #ff8e8e;
            font-size: 13px;
        }

        /* 3D Success Animation */
        .success{
            position: fixed;
            inset: 0;
            background: rgba(3,15,30,.94);
            z-index: 2000;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            opacity: 0;
            visibility: hidden;
            transition: .4s;
        }

        .success.active{
            opacity: 1;
            visibility: visible;
        }

        .cube{
            width: 80px;
            height: 80px;
            border: 3px solid #45caff;
            border-radius: 18px;

            box-shadow: 
                0 0 30px #00aaff,
                inset 0 0 25px rgba(0,180,255,.3);

            animation: cube3d 1.5s infinite linear;
        }

        @keyframes cube3d{
            0%{
                transform: rotateX(0deg) rotateY(0deg) scale(.7);
            }
            50%{
                transform: rotateX(180deg) rotateY(180deg) scale(1.15);
            }
            100%{
                transform: rotateX(360deg) rotateY(360deg) scale(.7);
            }
        }

        .success h2{
            margin-top: 30px;
            color: white;
            font-size: 23px;
            animation: textPop .7s ease;
        }

        @keyframes textPop{
            from{
                opacity: 0;
                transform: translateY(20px);
            }
            to{
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success p{
            color: rgba(255,255,255,.6);
            margin-top: 8px;
            font-size: 14px;
        }


        /* ================= DASHBOARD LAYOUT ================= */
        #dashboardScreen {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: var(--shadow-sm);
        }

        header::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -3px;
            height: 3px;
            background: linear-gradient(90deg, var(--csc-blue), var(--csc-orange));
        }

        .header-content {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 40px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
        }

        .header-csc-icon {
            background: linear-gradient(135deg, #0055a5, #f37021);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 800;
        }

        .logo-title h1 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--csc-blue);
        }

        .logo-title p {
            font-size: 0.75rem;
            color: var(--csc-orange);
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Search Bar in Header */
        .search-container {
            position: relative;
            width: 350px;
        }

        .search-container i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
            background: #f8fafc;
            transition: all 0.2s;
        }

        .search-input:focus {
            background: white;
            border-color: var(--csc-blue);
            box-shadow: 0 0 0 3px rgba(0, 85, 165, 0.1);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-badge {
            background: #e6f0fa;
            color: var(--csc-blue);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #b3d1ff;
        }

        .btn-logout {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .main-container {
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
            padding: 40px;
            flex-grow: 1;
        }

        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .view-title-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-back {
            background: #f1f5f9;
            color: var(--text-dark);
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-back:hover {
            background: #e2e8f0;
        }

        .view-title-area h2 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary-action {
            background: var(--csc-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(0, 85, 165, 0.2);
            transition: all 0.2s;
        }

        .btn-primary-action:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-primary-action:active {
            transform: translateY(0) scale(.97);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            perspective: 1000px;
        }

        .interactive-card {
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 25px;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(.2,.8,.2,1), box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .interactive-card:hover {
            transform: translateY(-6px) rotateX(3deg) scale(1.015);
            box-shadow: 0 22px 40px -10px rgba(0, 85, 165, 0.2);
            border-color: var(--csc-blue);
        }

        .card-top-content {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .card-icon-title {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-icon-title i {
            background: #e6f0fa;
            color: var(--csc-blue);
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .card-icon-title h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .card-icon-title p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .card-delete-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: color 0.2s;
            z-index: 2;
        }

        .card-edit-btn{
            border:none;
            width:42px;
            height:42px;
            border-radius:13px;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            background:linear-gradient(135deg,#0ea5e9,#2563eb);
            color:#fff;
            font-size:15px;
            box-shadow:0 7px 18px rgba(37,99,235,.22);
            transition:transform .2s ease, box-shadow .2s ease;
        }
        .card-edit-btn:hover{
            transform:translateY(-3px) rotate(-3deg);
            box-shadow:0 11px 24px rgba(37,99,235,.32);
        }
        .card-edit-btn:active{transform:translateY(1px) scale(.96);}


        .card-delete-btn:hover {
            color: #dc2626;
            background: #fee2e2;
        }

        .card-footer-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--csc-blue);
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .service-card-item {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
        }

        .service-card-item:hover {
            border-color: #cbd5e1;
            box-shadow: var(--shadow-md);
        }

        .service-info {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .service-info i {
            color: var(--csc-orange);
            font-size: 1.2rem;
        }

        .service-info a {
            color: var(--csc-blue);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            word-break: break-all;
        }

        .service-info a:hover {
            text-decoration: underline;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
        }

        .modal-card {
            background: var(--surface);
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: modalIn .35s cubic-bezier(.17,.67,.3,1.3);
        }

        @keyframes modalIn{
            from{ opacity: 0; transform: translateY(20px) scale(.96); }
            to{ opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .form-group-modal {
            margin-bottom: 16px;
        }

        .form-group-modal label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 6px;
            text-align: left;
        }

        .form-control-modal {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            text-align: left;
        }

        .form-control-modal:focus {
            border-color: var(--csc-blue);
            box-shadow: 0 0 0 3px rgba(0, 85, 165, 0.1);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-cancel {
            background: #f1f5f9;
            color: var(--text-dark);
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-submit {
            background: var(--csc-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        footer {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 24px 0;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: auto;
        }

        /* Mobile */
        @media(max-width:600px){
            .login-box{
                width: 100%;
                max-width: 390px;
                padding: 32px 24px;
                border-radius: 23px;
            }
            .logo{
                width: 88px;
                height: 88px;
            }
            .logo span{
                font-size: 29px;
            }
            h1.login-heading{
                font-size: 25px;
            }
        }

/* ===== PROFESSIONAL 3D UI UPDATE ===== */
:root{
  --theme-primary:#0055a5;
  --theme-secondary:#7c3aed;
  --theme-accent:#06b6d4;
  --theme-glow:rgba(6,182,212,.22);
  --page-gradient:linear-gradient(135deg,#f8fbff 0%,#eef4ff 48%,#f8fafc 100%);
}
body{
  background:var(--page-gradient);
  transition:background .5s ease;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  background:
    radial-gradient(circle at 15% 10%,rgba(0,85,165,.10),transparent 28%),
    radial-gradient(circle at 90% 80%,rgba(124,58,237,.09),transparent 30%);
}
button,.interactive-card,.service-card-item,.logo-area,.admin-badge{
  transform-style:preserve-3d;
}
button{
  -webkit-tap-highlight-color:transparent;
}
.btn-3d{
  position:relative;
  overflow:hidden;
  transition:transform .22s ease,box-shadow .22s ease,filter .22s ease;
}
.btn-3d::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.28) 50%,transparent 80%);
  transform:translateX(-120%);
  transition:transform .55s ease;
  pointer-events:none;
}
.btn-3d:hover{
  transform:translateY(-3px) translateZ(12px) scale(1.02);
  filter:saturate(1.12);
}
.btn-3d:hover::after{transform:translateX(120%);}
.btn-3d:active{transform:translateY(1px) scale(.97);}

.interactive-card{
  min-height:185px;
  background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(247,250,255,.94));
  box-shadow:12px 12px 28px rgba(15,23,42,.08),-7px -7px 18px rgba(255,255,255,.95),inset 0 1px rgba(255,255,255,.9);
}
.interactive-card::before{
  content:"";
  position:absolute;
  width:150px;height:150px;
  right:-65px;top:-65px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(6,182,212,.16),transparent 68%);
  pointer-events:none;
}
.interactive-card:hover{
  transform:translateY(-10px) rotateX(5deg) rotateY(-2deg) scale(1.025);
  box-shadow:18px 25px 45px rgba(0,85,165,.16),0 0 0 1px rgba(0,85,165,.16);
}
.card-icon-title i{

                    name: sub.name,

                }))

        async function checkAdmin() {
            const { data, error } = await db.rpc('is_admin');
            if (error) {
                console.error('Admin check error:', error);
                return false;
            }
            return data === true;
        }

        async function initSupabase() {
            try {
                const { data, error } = await db.auth.getSession();
                if (error) throw error;

                isAdmin = !!data.session && await checkAdmin();
                await loadDashboardData();

                if (isAdmin) showDashboard();
                else showLogin();
            } catch (err) {
                console.error('Supabase init error:', err);
                isAdmin = false;
                showLogin();
            }
        }

        async function handleLogin(e) {
            e.preventDefault();

            const email = 'narendrasahu2821@gmail.com';
            const password = document.getElementById('password')?.value || '';
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');

            if (!password) return;

            const { data, error } = await db.auth.signInWithPassword({ email, password });

            if (error) {
                errorDiv.textContent = 'Wrong password or login failed.';
                const passwordInput = document.getElementById('password');
                passwordInput.value = '';
                passwordInput.style.transform = 'translateX(-8px)';
                setTimeout(() => passwordInput.style.transform = 'translateX(8px)', 80);
                setTimeout(() => passwordInput.style.transform = 'translateX(0)', 160);
                return;
            }

            isAdmin = !!data.session && await checkAdmin();

            if (!isAdmin) {
                await db.auth.signOut();
                errorDiv.textContent = 'This account is not an admin account.';
                return;
            }

            errorDiv.textContent = '';
            successDiv.classList.add('active');

            setTimeout(async () => {
                successDiv.classList.remove('active');
                await loadDashboardData();
                showDashboard();
            }, 700);
        }

        async function handleLogout() {
            await db.auth.signOut();
            isAdmin = false;
            showToast('Logged out — public view remains available');
            showDashboard();
            renderApp();
        }

        function showLogin() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('dashboardScreen').classList.add('hidden');
            const p = document.getElementById('password');
            if (p) p.focus();
        }

        function showDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            renderApp();
        }

        function goHome() {
            currentView = 'home';
            selectedMainId = null;
            selectedSubId = null;
            const search = document.getElementById('globalSearch');
            if (search) search.value = '';
            renderApp();
        }

        function renderApp() {
            const container = document.getElementById('appView');
            if (!container) return;
            if (currentView === 'home') renderHomeView(container);
            else if (currentView === 'subsections') renderSubSectionsView(container);
            else if (currentView === 'services') renderServicesView(container);
            else if (currentView === 'search') renderSearchView(container);
        }

        const adminControls = (html) => isAdmin ? html : '';

        function renderHomeView(container) {
            let cardsHTML = '';
            dashboardData.forEach(main => {
                const subCount = main.subSections?.length || 0;
                cardsHTML += `
                    <div class="interactive-card" onclick="openMainSection('${main.id}')">
                        <div class="card-top-content">
                            <div class="card-icon-title"><i class="${escapeHTML(main.icon || 'fa-solid fa-folder')}"></i><div><h3>${escapeHTML(main.name)}</h3><p>${subCount} Sub-Sections</p></div></div>
                            ${adminControls(`<button class="card-edit-btn btn-3d" onclick="event.stopPropagation(); editMainSection('${main.id}')" title="Edit Category"><i class="fa-solid fa-pen"></i></button><button class="card-delete-btn" onclick="event.stopPropagation(); deleteMainSection('${main.id}')" title="Delete Category"><i class="fa-solid fa-trash-can"></i></button>`)}
                        </div>
                        <div class="card-footer-info"><span>Open Category</span><i class="fa-solid fa-arrow-right"></i></div>
                    </div>`;
            });
            container.innerHTML = `
                <div class="view-header"><div class="view-title-area"><h2><i class="fa-solid fa-layer-group" style="color:var(--csc-blue);"></i> Main Service Categories</h2></div>
                ${adminControls(`<button onclick="openModal('mainSectionModal')" class="btn-primary-action btn-3d"><i class="fa-solid fa-plus-circle"></i> Add Main Category</button>`)}</div>
                <div class="cards-grid">${cardsHTML || '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px;">No categories added yet.</p>'}</div>`;
        }

        function openMainSection(mainId) { selectedMainId = mainId; currentView = 'subsections'; renderApp(); }

        function renderSubSectionsView(container) {
            const mainSec = dashboardData.find(m => m.id === selectedMainId);
            if (!mainSec) return goHome();
            let subHTML = '';
            (mainSec.subSections || []).forEach(sub => {
                const srvCount = sub.services?.length || 0;
                subHTML += `<div class="interactive-card" onclick="openSubSection('${sub.id}')"><div class="card-top-content"><div class="card-icon-title"><i class="fa-solid fa-folder-tree" style="color:var(--csc-orange);background:#fff3ec;"></i><div><h3>${escapeHTML(sub.name)}</h3><p>${srvCount} Services Available</p></div></div>${adminControls(`<button class="card-edit-btn btn-3d" onclick="event.stopPropagation(); editSubSection('${sub.id}')"><i class="fa-solid fa-pen"></i></button><button class="card-delete-btn" onclick="event.stopPropagation(); deleteSubSection('${sub.id}')"><i class="fa-solid fa-trash-can"></i></button>`)}</div><div class="card-footer-info" style="color:var(--csc-orange);"><span>View Services</span><i class="fa-solid fa-arrow-right"></i></div></div>`;
            });
            container.innerHTML = `<div class="view-header"><div class="view-title-area"><button class="btn-back btn-3d" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i> Back</button><h2><i class="fa-solid fa-folder-open" style="color:var(--csc-blue);"></i> ${escapeHTML(mainSec.name)} / Sub-Sections</h2></div>${adminControls(`<button onclick="openModal('subSectionModal')" class="btn-primary-action btn-3d"><i class="fa-solid fa-plus-circle"></i> Add Sub-Section</button>`)}</div><div class="cards-grid">${subHTML || '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px;">No sub-sections added in this category yet.</p>'}</div>`;
        }

        function openSubSection(subId) { selectedSubId = subId; currentView = 'services'; renderApp(); }

        function renderServicesView(container) {
            const mainSec = dashboardData.find(m => m.id === selectedMainId);
            const subSec = mainSec?.subSections?.find(s => s.id === selectedSubId);
            if (!mainSec || !subSec) return goHome();
            let srvHTML = '';
            (subSec.services || []).forEach(srv => {
                srvHTML += `<div class="service-card-item"><div class="service-info" style="flex:1;min-width:0;"><i class="fa-solid fa-globe"></i><div style="min-width:0;"><div style="font-weight:800;font-size:1rem;color:var(--text-dark);margin-bottom:4px;">${escapeHTML(srv.name)}</div></div></div><div style="display:flex;align-items:center;gap:8px;margin-left:12px;"><button class="open-link-btn btn-3d" onclick="openServiceLink('${encodeURIComponent(srv.link)}')"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open</button>${adminControls(`<button class="card-edit-btn btn-3d" onclick="editService('${srv.id}')"><i class="fa-solid fa-pen"></i></button><button class="card-delete-btn" onclick="deleteService('${srv.id}')"><i class="fa-solid fa-trash-can"></i></button>`)}</div></div>`;
            });
            container.innerHTML = `<div class="view-header"><div class="view-title-area"><button class="btn-back btn-3d" onclick="openMainSection('${selectedMainId}')"><i class="fa-solid fa-arrow-left"></i> Back</button><h2><i class="fa-solid fa-list-check" style="color:var(--csc-blue);"></i> ${escapeHTML(subSec.name)}</h2></div>${adminControls(`<button onclick="openModal('serviceModal')" class="btn-primary-action btn-3d"><i class="fa-solid fa-plus-circle"></i> Add Service Link</button>`)}</div><div class="services-grid">${srvHTML || '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px;">No services added in this sub-section yet.</p>'}</div>`;
        }

        function handleSearch(e) {
            const query = e.target.value.toLowerCase().trim();
            if (!query) return goHome();
            currentView = 'search';
            const matched = [];
            dashboardData.forEach(main => (main.subSections || []).forEach(sub => (sub.services || []).forEach(srv => {
                if ([srv.name, srv.link, sub.name, main.name].some(v => String(v).toLowerCase().includes(query))) matched.push({mainName:main.name,subName:sub.name,name:srv.name,link:srv.link});
            })));
            const results = matched.length ? matched.map(r => `<div class="service-card-item" style="flex-direction:column;align-items:stretch;gap:12px;"><div style="font-size:.75rem;font-weight:800;color:var(--csc-orange);text-transform:uppercase;">${escapeHTML(r.mainName)} › ${escapeHTML(r.subName)}</div><div class="service-info"><i class="fa-solid fa-globe"></i><div><div style="font-weight:800;font-size:1rem;color:var(--text-dark);">${escapeHTML(r.name)}</div></div></div><button class="open-link-btn btn-3d" style="align-self:flex-end;" onclick="openServiceLink('${encodeURIComponent(r.link)}')"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open Website</button></div>`).join('') : `<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px;">No services found matching "${escapeHTML(query)}".</p>`;
            document.getElementById('appView').innerHTML = `<div class="view-header"><div class="view-title-area"><button class="btn-back btn-3d" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i> Home</button><h2><i class="fa-solid fa-magnifying-glass" style="color:var(--csc-blue);"></i> Search Results</h2></div></div><div class="services-grid">${results}</div>`;
        }

        function renderSearchView(container) { container.innerHTML = ''; }

        function openModal(id) { if (!isAdmin) return showToast('Admin login required'); document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        async function handleMainSectionSubmit(e) {
            e.preventDefault(); if (!isAdmin) return;
            const name = document.getElementById('mainSecName').value.trim();
            const icon = document.getElementById('mainSecIcon').value.trim() || 'fa-solid fa-folder';
            if (!name) return;
            let error;
            if (editingMainId) ({ error } = await db.from('sections').update({ name, icon }).eq('id', editingMainId));
            else ({ error } = await db.from('sections').insert({ name, icon }));
            if (error) return showToast('Save failed: ' + error.message);
            closeModal('mainSectionModal'); editingMainId = null; e.target.reset(); document.getElementById('mainSecIcon').value='fa-solid fa-id-card'; await loadDashboardData(); showToast('Category saved successfully');
        }

        function editMainSection(id) {
            if (!isAdmin) return; const m = dashboardData.find(x=>x.id===id); if (!m) return;
            editingMainId=id; document.getElementById('mainSecName').value=m.name; document.getElementById('mainSecIcon').value=m.icon||'fa-solid fa-folder'; document.getElementById('mainSectionModalTitle').textContent='Edit Main Category'; document.getElementById('mainSectionSubmitBtn').textContent='Update Category'; openModal('mainSectionModal');
        }

        async function handleSubSectionSubmit(e) {
            e.preventDefault(); if (!isAdmin) return;
            const name=document.getElementById('subSecName').value.trim(); if(!name||!selectedMainId)return;
            let error;
            if(editingSubId) ({error}=await db.from('subsections').update({name}).eq('id',editingSubId));
            else ({error}=await db.from('subsections').insert({section_id:selectedMainId,name}));
            if(error)return showToast('Save failed: '+error.message);
            closeModal('subSectionModal'); editingSubId=null; e.target.reset(); document.getElementById('subSectionModalTitle').textContent='Add Sub-Section Name'; document.getElementById('subSectionSubmitBtn').textContent='Add Sub-Section'; await loadDashboardData(); showToast('Sub-section saved successfully');
        }

        function editSubSection(id) {
            if(!isAdmin)return; const m=dashboardData.find(x=>x.id===selectedMainId); const s=m?.subSections?.find(x=>x.id===id); if(!s)return;
            editingSubId=id; document.getElementById('subSecName').value=s.name; document.getElementById('subSectionModalTitle').textContent='Edit Sub-Section'; document.getElementById('subSectionSubmitBtn').textContent='Update Sub-Section'; openModal('subSectionModal');
        }

        async function handleServiceSubmit(e) {
            e.preventDefault(); if(!isAdmin)return;
            const name=document.getElementById('srvName').value.trim(); const link=document.getElementById('srvLink').value.trim(); if(!name||!link||!selectedSubId)return;
            let error;
            if(editingServiceId) ({error}=await db.from('services').update({name,link}).eq('id',editingServiceId));
            else ({error}=await db.from('services').insert({subsection_id:selectedSubId,name,link}));
            if(error)return showToast('Save failed: '+error.message);
            closeModal('serviceModal'); editingServiceId=null; e.target.reset(); document.getElementById('serviceModalTitle').textContent='Add Service Name & Link'; document.getElementById('serviceSubmitBtn').textContent='Save Service'; await loadDashboardData(); showToast('Service saved successfully');
        }

        function editService(id) {
            if(!isAdmin)return; const m=dashboardData.find(x=>x.id===selectedMainId); const s=m?.subSections?.find(x=>x.id===selectedSubId); const srv=s?.services?.find(x=>x.id===id); if(!srv)return;
            editingServiceId=id; document.getElementById('srvName').value=srv.name; document.getElementById('srvLink').value=srv.link; document.getElementById('serviceModalTitle').textContent='Edit Service'; document.getElementById('serviceSubmitBtn').textContent='Update Service'; openModal('serviceModal');
        }

        async function deleteMainSection(id) {
            if(!isAdmin||!confirm('Are you sure you want to delete this main category and all its contents?'))return;
            const {error}=await db.from('sections').delete().eq('id',id); if(error)return showToast('Delete failed: '+error.message); await loadDashboardData(); showToast('Category deleted');
        }
        async function deleteSubSection(id) {
            if(!isAdmin||!confirm('Are you sure you want to delete this sub-section?'))return;
            const {error}=await db.from('subsections').delete().eq('id',id); if(error)return showToast('Delete failed: '+error.message); await loadDashboardData(); showToast('Sub-section deleted');
        }
        async function deleteService(id) {
            if(!isAdmin||!confirm('Are you sure you want to delete this service link?'))return;
            const {error}=await db.from('services').delete().eq('id',id); if(error)return showToast('Delete failed: '+error.message); await loadDashboardData(); showToast('Service deleted');
        }

        function showToast(message) {
            const toast = document.getElementById('toastMsg');
            if (!toast) return;
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        function setTheme(theme) {
            const root = document.documentElement;
            const themes = {
                blue:   {p:'#0055a5',s:'#7c3aed',a:'#06b6d4',g:'rgba(6,182,212,.22)',bg:'linear-gradient(135deg,#f8fbff 0%,#eef4ff 48%,#f8fafc 100%)'},
                purple: {p:'#6d28d9',s:'#db2777',a:'#a855f7',g:'rgba(168,85,247,.22)',bg:'linear-gradient(135deg,#fbf7ff 0%,#f5edff 50%,#fff7fb 100%)'},
                green:  {p:'#047857',s:'#0f766e',a:'#14b8a6',g:'rgba(20,184,166,.22)',bg:'linear-gradient(135deg,#f4fffb 0%,#eafff7 50%,#f7fffc 100%)'},
                dark:   {p:'#334155',s:'#7c3aed',a:'#06b6d4',g:'rgba(6,182,212,.18)',bg:'linear-gradient(135deg,#0b1220,#111827,#0f172a)'}
            };
            const t = themes[theme] || themes.blue;
            root.style.setProperty('--theme-primary',t.p);
            root.style.setProperty('--theme-secondary',t.s);
            root.style.setProperty('--theme-accent',t.a);
            root.style.setProperty('--theme-glow',t.g);
            root.style.setProperty('--page-gradient',t.bg);
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            const active = document.querySelector('.theme-' + theme);
            if (active) active.classList.add('active');

            if (theme === 'dark') {
                root.style.setProperty('--surface','#111827');
                root.style.setProperty('--text-dark','#f8fafc');
                root.style.setProperty('--text-muted','#94a3b8');
                root.style.setProperty('--border','#334155');
            } else {
                root.style.setProperty('--surface','#ffffff');
                root.style.setProperty('--text-dark','#0f172a');
                root.style.setProperty('--text-muted','#64748b');
                root.style.setProperty('--border','#e2e8f0');
            }
            localStorage.setItem('cscTheme', theme);
            showToast(theme.charAt(0).toUpperCase()+theme.slice(1)+' theme applied');
        }

        // 3D cursor glow follows the mouse.
        document.addEventListener('mousemove', function(e){
            const glow = document.getElementById('cursorGlow');
            if (glow) {
                glow.style.left = e.clientX + 'px';
                glow.style.top = e.clientY + 'px';
            }
        });

        // Click ripple on interactive buttons/cards.
        document.addEventListener('click', function(e){
            const target = e.target.closest('button, .interactive-card');
            if (!target) return;
            if (target.classList.contains('card-delete-btn')) return;
            const rect = target.getBoundingClientRect();
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            ripple.style.left = (e.clientX - rect.left) + 'px';
            ripple.style.top = (e.clientY - rect.top) + 'px';
            target.appendChild(ripple);
            setTimeout(() => ripple.remove(), 650);
        });

        // Load saved visual theme.
        try {
            const savedTheme = localStorage.getItem('cscTheme');
            if (savedTheme) setTheme(savedTheme);
        } catch(e) {}


        document.addEventListener('DOMContentLoaded', initSupabase);

    </script>
</body>
</html>
